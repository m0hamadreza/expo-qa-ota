# Self-hosted OTA update server (xprem) + Postgres.
# Usage:  cp infra/.env.example infra/.env  (fill the secrets)  &&  npm run infra:up
services:
  db:
    image: postgres:16-alpine
    pull_policy: missing
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: xprem
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d xprem"]
      interval: 3s
      timeout: 3s
      retries: 20

  xprem:
    image: ghcr.io/mercuretechnologies/xprem:v3.2.8
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      # Phones/emulators build manifest + asset URLs from this, so it must be
      # reachable from the device (your Mac's LAN IP, not localhost).
      BASE_URL: ${BASE_URL}
      DB_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/xprem?sslmode=disable
      DB_KEYS_MASTER_KEY_B64: ${DB_KEYS_MASTER_KEY_B64}
      JWT_SECRET: ${JWT_SECRET}
      STORAGE_MODE: local
      LOCAL_BUCKET_BASE_PATH: /updates
      CACHE_MODE: local
      USE_DASHBOARD: "true"
      DASHBOARD_ROOT_REDIRECT: "true"
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DISABLE_TELEMETRY: "true"
    volumes:
      - ./data/updates:/updates
